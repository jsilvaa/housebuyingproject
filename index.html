          <div className="card">
            <h3>Monthly Split — Who Pays What</h3>
            <div className="ledger-line">
              <span className="label">{active.ownerAName || "Owner A"} ({active.ownerASplitPct}%)</span>
              <span className="dots"></span>
              <span className="val mono">{fmtUSD(results.outOfPocket * (active.ownerASplitPct / 100))}</span>
            </div>
            <div className="ledger-line">
              <span className="label">{active.ownerBName || "Owner B"} ({100 - active.ownerASplitPct}%)</span>
              <span className="dots"></span>
              <span className="val mono">{fmtUSD(results.outOfPocket * (1 - active.ownerASplitPct / 100))}</span>
            </div>
            <div className="ledger-line total">
              <span className="label">Combined out-of-pocket / mo</span>
              <span className="dots"></span>
              <span className="val mono">{fmtUSD(results.outOfPocket)}</span>
            </div>
            {active.avoidedRentMonthly > 0 && (
              <>
                <div className="ledger-line sub">
                  <span className="label">Less: rent you'd pay anyway</span>
                  <span className="dots"></span>
                  <span className="val mono">-{fmtUSD(active.avoidedRentMonthly)}</span>
                </div>
                <div className="ledger-line total">
                  <span className="label">{results.effectiveCost >= 0 ? "True added cost of owning / mo" : "Net savings vs. renting / mo"}</span>
                  <span className="dots"></span>
                  <span className={`val mono ${results.effectiveCost < 0 ? "pos" : ""}`} style={{ color: results.effectiveCost < 0 ? "#2F5D3A" : undefined }}>
                    {fmtUSD(Math.abs(results.effectiveCost))}
                  </span>
                </div>
                <p className="note">This is the "vs. renting" comparison — what buying actually costs you on top of housing you'd need anyway, not a raw ROI figure.</p>
              </>
            )}
          </div>
          <div className="card">
            <h3>Return Metrics</h3>
            <div className="ledger-line sub"><span className="label">DSCR (NOI ÷ annual PITI)</span><span className="dots"></span><span className="val mono">{results.dscr.toFixed(2)}×</span></div>
            <div className="ledger-line sub"><span className="label">Cash-on-cash return</span><span className="dots"></span><span className="val mono">{fmtPct(results.cashOnCash)}</span></div>
          </div>
          <div className="closing-card">
            <h3>Cash to Close</h3>
            <div className="ledger-line"><span className="label">Down payment ({active.downPct}%)</span><span className="dots"></span><span className="val mono">{fmtUSD(results.downAmt)}</span></div>
            <div className="ledger-line"><span className="label">Closing costs ({active.closingCostPct}%)</span><span className="dots"></span><span className="val mono">{fmtUSD(results.closingCosts)}</span></div>
            {results.dpaAmount > 0 && (
              <div className="ledger-line"><span className="label">Less: DPA second loan</span><span className="dots"></span><span className="val mono">-{fmtUSD(results.dpaAmount)}</span></div>
            )}
            <div className="ledger-line total"><span className="label">Cash needed at closing</span><span className="dots"></span><span className="val mono">{fmtUSD(results.cashToClose)}</span></div>
            <div className="ledger-line sub">
              <span className="label">{active.ownerAName || "Owner A"} ({active.ownerASplitPct}%)</span>
              <span className="dots"></span>
              <span className="val mono">{fmtUSD(results.cashToClose * (active.ownerASplitPct / 100))}</span>
            </div>
            <div className="ledger-line sub">
              <span className="label">{active.ownerBName || "Owner B"} ({100 - active.ownerASplitPct}%)</span>
              <span className="dots"></span>
              <span className="val mono">{fmtUSD(results.cashToClose * (1 - active.ownerASplitPct / 100))}</span>
            </div>
            {results.secondLoanBalance > 0 && (
              <>
                <p className="note" style={{ color: "rgba(247,244,236,0.65)" }}>
                  Not free money: {fmtUSD(results.secondLoanBalance)} DPA second loan accrues simple interest at {active.dpaRatePct}%/yr
                  and is owed in full — typically due on sale, refinance, or payoff, not as a monthly bill. Confirm the deferral terms
                  with your lender.
                </p>
                <div className="ledger-line sub">
                  <span className="label">Owed if paid off in 5 yrs</span><span className="dots"></span>
                  <span className="val mono">{fmtUSD(results.secondLoanBalance * (1 + (active.dpaRatePct / 100) * 5))}</span>
                </div>
                <div className="ledger-line sub">
                  <span className="label">Owed if paid off in 10 yrs</span><span className="dots"></span>
                  <span className="val mono">{fmtUSD(results.secondLoanBalance * (1 + (active.dpaRatePct / 100) * 10))}</span>
                </div>
              </>
            )}
          </div>
        </div>
      </div>
      <div className="card">
        <h3>
          Exit Scenario — Hold {(active.holdYears !== undefined && active.holdYears !== null) ? active.holdYears : 3} Years and Sell
          <span className="tip" title="Projects the property's value forward using a compounding annual appreciation rate, subtracts what you'd still owe on both loans plus typical selling costs, and shows your equity if you sold. Also compares against simply converting the owner-occupied unit to a rental and holding instead of selling.">
            {" "}ⓘ
          </span>
        </h3>
        <div className="field-row" style={{ flexWrap: "wrap" }}>
          {numField("Hold period (years)", "holdYears", {
            tooltip: "How many years you plan to live in / hold the property before selling. Applies to all properties, for a fair side-by-side comparison.",
            syncAll: true,
          })}
          {numField("Annual appreciation (%)", "appreciationPct", {
            tooltip: "Assumed yearly home price growth. East Bay long-run averages have historically run roughly 3–6%/yr, but this varies a lot by cycle — treat this as a planning assumption, not a guarantee. Applies to all properties.",
            syncAll: true,
          })}
          {numField("Selling costs (%)", "sellingCostPct", {
            tooltip: "Agent commissions plus closing costs on the sale side, typically combined around 6–8% of sale price. Applies to all properties.",
            syncAll: true,
          })}
          {numField("Rent growth (%/yr)", "rentEscalationPct", {
            tooltip: "Assumed annual rent increase, compounded over the hold period. Used only for the fully-rented alternative comparison below, not for your current out-of-pocket cost. Applies to all properties.",
            syncAll: true,
          })}
        </div>
        <p className="note" style={{ marginTop: -4 }}>
          These four assumptions apply to all properties at once, so the comparison below stays apples-to-apples.
          Everything else on this tab (rent, price, insurance, etc.) stays specific to this property.
        </p>
        <div className="metric-grid" style={{ marginTop: 14 }}>
          <div className="metric">
            <span className="eyebrow">Projected value</span>
            <div className="value">{fmtUSD(results.futureValue)}</div>
            <div className="sub">+{fmtUSD(results.totalAppreciationGain)} over {results.holdYears} yrs</div>
          </div>
          <div className="metric">
            <span className="eyebrow">Remaining 1st loan</span>
            <div className="value">{fmtUSD(results.loanBalanceAtExit)}</div>
            <div className="sub">at year {results.holdYears}</div>
          </div>
          <div className="metric">
            <span className="eyebrow">DPA owed at exit</span>
            <div className="value">{fmtUSD(results.secondLoanAtExit)}</div>
            <div className="sub">simple interest, {active.dpaRatePct}%/yr</div>
          </div>
          <div className="metric">
            <span className="eyebrow">Selling costs</span>
            <div className="value">{fmtUSD(results.sellingCosts)}</div>
            <div className="sub">{active.sellingCostPct}% of sale price</div>
          </div>
          <div className="metric">
            <span className="eyebrow">Net equity if sold</span>
            <div className={`value ${results.equityAtSale >= 0 ? "pos" : "neg"}`}>{fmtUSD(results.equityAtSale)}</div>
            <div className="sub">{fmtUSD(results.equityAtSale * (active.ownerASplitPct / 100))} / {fmtUSD(results.equityAtSale * (1 - active.ownerASplitPct / 100))} split</div>
          </div>
        </div>
        <p className="note" style={{ marginTop: 12 }}>
          Alternative to selling: if instead you moved out and rented the unit you currently occupy too (fully rented, no
          sale), estimated cash flow at today's rents would be{" "}
          <strong className={results.fullyRentedMonthlyCashFlow >= 0 ? "pos" : "neg"}>{fmtUSD(results.fullyRentedMonthlyCashFlow)}/mo</strong>{" "}
          ({fmtUSD(results.fullyRentedAnnualCashFlow)}/yr). Escalating rent at {results.rentEscalationPct}%/yr over{" "}
          {results.holdYears} years brings gross rent to {fmtUSD(results.escalatedGrossRent)}/mo, for an estimated{" "}
          <strong className={results.escalatedMonthlyCashFlow >= 0 ? "pos" : "neg"}>{fmtUSD(results.escalatedMonthlyCashFlow)}/mo</strong>{" "}
          ({fmtUSD(results.escalatedAnnualCashFlow)}/yr) cash flow by year {results.holdYears}. Selling realizes{" "}
          {fmtUSD(results.equityAtSale)} today; holding and renting keeps that equity invested in the property while it
          (hopefully) keeps appreciating, plus growing rental cash flow.
        </p>
      </div>
      <div className="card">
        <h3>
          Break-Even vs. Renting
          <span className="tip" title="Compares two piles of money at a given year: (1) the equity you'd walk away with if you sold — projected value minus remaining loans minus selling costs — and (2) the cash you've put in beyond what renting would've cost you — cash to close plus the monthly gap between your out-of-pocket cost and your avoided rent, compounded over time. When pile (1) catches up to pile (2), you've broken even.">
            {" "}ⓘ
          </span>
        </h3>
        <div className="slider-row">
          <div className="slider-label">
            <span>Preview year</span>
            <span className="year-val">Year {previewYear}</span>
          </div>
          <input
            type="range"
            min={1}
            max={breakEven.maxYears}
            step={1}
            value={previewYear}
            onChange={(e) => update("breakEvenPreviewYears", parseInt(e.target.value, 10))}
          />
        </div>
        <div className="metric-grid">
          <div className="metric">
            <span className="eyebrow">Equity if sold, year {previewYear}</span>
            <div className="value">{fmtUSD(previewRow.equity)}</div>
            <div className="sub">{fmtUSD(previewRow.futureValue)} projected value</div>
          </div>
          <div className="metric">
            <span className="eyebrow">Cash in beyond renting, year {previewYear}</span>
            <div className="value">{fmtUSD(previewRow.cumulativeExtraCash)}</div>
            <div className="sub">cash to close + cumulative out-of-pocket vs. avoided rent</div>
          </div>
          <div className="metric">
            <span className="eyebrow">Net position, year {previewYear}</span>
            <div className={`value ${previewRow.netPosition >= 0 ? "pos" : "neg"}`}>{fmtUSD(previewRow.netPosition)}</div>
            <div className="sub">{previewRow.netPosition >= 0 ? "ahead of renting" : "behind renting"}</div>
          </div>
          <div className="metric">
            <span className="eyebrow">Break-even year</span>
            <div className="value">{breakEven.breakEvenYear ? `Year ${breakEven.breakEvenYear}` : `Beyond ${breakEven.maxYears}`}</div>
            <div className="sub">first year equity overtakes cash paid in</div>
          </div>
        </div>
        <p className="note">
          Assumes today's out-of-pocket cost and avoided rent hold flat year over year (no escalation), and that appreciation
          and selling costs follow the same assumptions as the Exit Scenario above. A rough planning tool, not a forecast.
        </p>
      </div>
      <div className="card">
        <h3>
          Amortization Schedule — Principal &amp; Interest
          <span className="tip" title="Year-by-year breakdown of your first mortgage payment, split into principal and interest, based on the current loan amount, rate, and term. Excludes FHA MIP, taxes, insurance, and HOA.">
            {" "}ⓘ
          </span>
        </h3>
        <button
          type="button"
          className="refresh-btn"
          onClick={() => setShowAmort((v) => !v)}
          style={{ marginBottom: 14 }}
        >
          {showAmort ? "▾ Hide table" : "▸ Show table"}
        </button>
        {showAmort && (
          <>
            <table className="compare">
              <thead>
                <tr>
                  <th>Year</th><th>Payment</th><th>Principal</th><th>Interest</th><th>Ending Balance</th>
                </tr>
              </thead>
              <tbody>
                {amortSchedule.map((row) => (
                  <tr key={row.year} style={row.year === holdYearRounded ? { background: "var(--paper2)", fontWeight: 600 } : undefined}>
                    <td>{row.year}</td>
                    <td>{fmtUSD(row.totalPaid)}</td>
                    <td>{fmtUSD(row.principalPaid)}</td>
                    <td>{fmtUSD(row.interestPaid)}</td>
                    <td>{fmtUSD(row.endBalance)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p className="note">Principal &amp; interest only. Excludes the recurring annual FHA mortgage insurance (MIP) premium, taxes, insurance, and HOA — those are shown separately in the Monthly Housing Payment card above. (The financed upfront MIP is folded into the loan balance itself, so it is amortized along with the rest of the principal.)</p>
          </>
        )}
      </div>
      {properties.length > 1 && (
        <div className="card">
          <h3>Exit Scenario Comparison (at each property's hold period)</h3>
          <table className="compare">
            <thead>
              <tr>
                <th>Property</th><th>Price today</th><th>Hold (yrs)</th><th>Appreciation/yr</th>
                <th>Projected value</th><th>Net equity if sold</th><th>Fully-rented/mo (today)</th>
                <th title="Fully-rented cash flow at the end of the hold period, with rent escalated at the assumed annual growth rate.">Fully-rented/mo (yr N)</th>
              </tr>
            </thead>
            <tbody>
              {allResults.map(({ p, r }) => (
                <tr key={p.id}>
                  <td style={{ fontFamily: "Inter", fontWeight: 600 }}>{p.nickname}</td>
                  <td>{fmtUSD(p.price)}</td>
                  <td>{r.holdYears}</td>
                  <td>{fmtPct(r.appreciationPct, 1)}</td>
                  <td>{fmtUSD(r.futureValue)}</td>
                  <td className={r.equityAtSale >= 0 ? "pos" : "neg"}>{fmtUSD(r.equityAtSale)}</td>
                  <td className={r.fullyRentedMonthlyCashFlow >= 0 ? "pos" : "neg"}>{fmtUSD(r.fullyRentedMonthlyCashFlow)}</td>
                  <td className={r.escalatedMonthlyCashFlow >= 0 ? "pos" : "neg"}>{fmtUSD(r.escalatedMonthlyCashFlow)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className="note">
            Appreciation is a planning assumption (default 4%/yr), not a forecast — adjust it per property on that
            property's tab to stress-test optimistic vs. conservative scenarios.
          </p>
        </div>
      )}
      {properties.length > 1 && (
        <div className="card">
          <h3>Compare Properties</h3>
          <table className="compare">
            <thead>
              <tr>
                <th>Property</th><th>Price</th><th>PITI/mo</th><th>Out-of-pocket/mo</th>
                <th>Net cash flow/mo</th><th>Cash to close</th><th>Cash-on-cash</th><th title="Annual net operating income (rent minus operating costs, excluding mortgage) divided by price — measures income efficiency independent of financing.">Cap rate ⓘ</th>
              </tr>
            </thead>
            <tbody>
              {allResults.map(({ p, r }) => (
                <tr key={p.id}>
                  <td style={{ fontFamily: "Inter", fontWeight: 600 }}>{p.nickname}</td>
                  <td>{fmtUSD(p.price)}</td>
                  <td>{fmtUSD(r.piti)}</td>
                  <td className={r.outOfPocket <= 0 ? "pos" : ""}>{fmtUSD(r.outOfPocket)}</td>
                  <td className={r.monthlyCashFlow >= 0 ? "pos" : "neg"}>{fmtUSD(r.monthlyCashFlow)}</td>
                  <td>{fmtUSD(r.cashToClose)}</td>
                  <td className={r.cashOnCash >= 0 ? "pos" : "neg"}>{fmtPct(r.cashOnCash)}</td>
                  <td>{fmtPct(r.capRate)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      <p className="note">
        Rent for the Delaware St test property is estimated from nearby North Berkeley 3bd comps (~$4,000–4,500/mo) — Zillow had no
        Rent Zestimate for this listing, so confirm with a live comp pull or property manager before relying on it. 701 40th St is a
        fully-occupied fourplex (active listing, $999,995, listed 5/18/2026) — all four 1bd/1ba units currently have tenants on
        month-to-month leases, so unlike the other tabs, immediate owner-occupancy at close isn't guaranteed under FHA's
        owner-occupancy requirement; the lowest-rent unit is modeled as the one you'd move into once vacated. All figures are
        estimates for planning purposes, not a loan commitment.
      </p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<ROIDashboard />);
</script>
</body>
</html>
